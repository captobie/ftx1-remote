# Lets ftx1-audiostream.py and Direwolf's own APRS-decode capture share the
# same physical USB sound card (card 1, the FTX-1's audio-out) instead of
# fighting over exclusive access to it — confirmed a real conflict on
# 2026-09-07 ("Device or resource busy [plughw:1,0]") once both were
# actually running at once, not just a theoretical concern.
#
# `dsnoop` opens the raw hardware device exactly once and fans its capture
# out to any number of readers; `plug` layered on top lets each reader
# (Direwolf, this script) request its own sample rate/format independently,
# with ALSA handling the resampling per-reader rather than needing the
# `dsnoop` slave's rate to satisfy everyone at once.
#
# `rate 48000` below is a starting guess (a common USB-audio-class default,
# and Direwolf's own typical default `ARATE`), not confirmed against this
# specific hardware — if opening `ftx1_shared` fails, check what rate
# Direwolf's own config actually already uses successfully (`grep -i arate
# /etc/direwolf.conf`) and match it here instead.
#
# Install: append this file's contents to /etc/asound.conf (create it if it
# doesn't exist), then point this script's DEVICE constant at "ftx1_shared"
# and /etc/direwolf.conf's ADEVICE at "ftx1_shared plughw:1,0" (Direwolf's
# two-argument input/output form — dsnoop only supports capture, so
# Direwolf's playback/TX side has to stay on the raw device directly, only
# its capture/RX side needs to share), then restart both services.

pcm.ftx1_dsnoop {
    type dsnoop
    ipc_key 4522
    ipc_key_add_uid false
    # Direwolf runs as user "direwolf", this script as "ftx1audio" —
    # different Unix accounts. dsnoop's IPC semaphore/shared-memory objects
    # default to permissions that only let the *creating* user attach;
    # without this, whichever of the two processes gets there second fails
    # with "Permission denied [ftx1_shared]" (confirmed 2026-09-07).
    ipc_perm 0666
    slave {
        pcm "hw:1,0"
        channels 1
        rate 48000
        format S16_LE
        period_size 1024
    }
}

pcm.ftx1_shared {
    type plug
    slave.pcm "ftx1_dsnoop"
}
